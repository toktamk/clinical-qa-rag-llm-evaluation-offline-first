evaluation:
  k_values: [1, 3, 5, 10]

retrieval:
  metrics:
    - recall_at_k
    - hit_at_k
    - mrr_at_k
    - ndcg_at_k
    - precision_at_k

generation:
  metrics:
    - answer_correctness
    - groundedness
    - citation_precision
    - citation_recall
    - abstention_accuracy
    - evidence_only_compliance

hallucination:
  claim_extraction: atomic
  verifier: local_nli
  metrics:
    - unsupported_claim_rate
    - hallucination_rate
    - false_confidence_rate
    - citation_hallucination_rate

abstention:
  abstention_texts:
    - "I do not know based on the available evidence."
    - "The provided evidence is insufficient."
  metrics:
    - abstention_precision
    - abstention_recall
    - over_refusal_rate
    - under_refusal_rate
    - selective_accuracy

system:
  repeats: 30
  metrics:
    - p50_latency
    - p95_latency
    - retrieval_latency
    - generation_latency
    - verifier_latency
    - tokens_per_second
    - peak_ram_mb